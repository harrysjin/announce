name: Learning storage checks
on:
  pull_request:
    paths: ['backend/**', 'src/**', 'tests/**', 'requirements.txt', 'package*.json', '.github/workflows/learning-checks.yml']
  push:
    branches: ['feature/learning-audit-phase1']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learning_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: learning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U learning_test -d learning_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEARNING_TEST_DATABASE_URL: postgresql://learning_test:disposable_ci_password@localhost:5432/learning_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=.:tests python tests/learning_benchmark.py
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=.:tests python tests/learning_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-browser-results
          path: test-results/learning-browser/
          retention-days: 7
